<!--
  Allbound360 wordmark, inlined as an Astro SVG component so it can re-tone.

  Two deliberate changes from the brand file:
    - the "Allbound" letterforms are `currentColor`, not #06152D — that navy is
      invisible on the dark theme's #17181d surface
    - the blue is `var(--brand-allbound)`, which ProjectCard defines per theme;
      #2563EB is the brand value and the fallback if the var never lands

  width/height are dropped so the viewBox alone drives sizing from CSS.
-->
